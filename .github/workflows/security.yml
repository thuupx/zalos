name: Security & SSDF Assurance

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly scheduled scan of released lockfiles for newly disclosed CVEs (SSDF RV.1).
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write
  attestations: write

jobs:
  security-tests:
    name: Security & Cryptography Test Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust Noise & Vault tests
        run: cargo test -p zalos-noise -p zalos-vault --locked

      - name: Install server dependencies (frozen)
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Server typecheck & security test gate
        working-directory: server
        run: |
          bunx tsc --noEmit
          bun test \
            test/security.test.ts \
            test/security-architecture.test.ts \
            test/security-phase2.test.ts \
            test/pairing.test.ts \
            test/vault-integ.test.ts \
            test/zca-hardening.test.ts \
            test/review-fixes.test.ts \
            test/doctor.test.ts \
            test/local-mode.test.ts \
            test/upload-staging.test.ts

  advisory-and-secret-scan:
    name: Vulnerability & Secret Scanning (SSDF PW.3 / RV.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: OSV-Scanner (Bun, Rust, Flutter lockfiles)
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.1
        with:
          scan-args: |-
            --lockfile=server/bun.lock
            --lockfile=Cargo.lock
            --lockfile=client/pubspec.lock

      - name: Cargo Audit (Rust advisories)
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom-and-provenance:
    name: CycloneDX SBOM & Release Checksums (SSDF PS.1 / PS.2)
    runs-on: ubuntu-latest
    needs: [security-tests]
    steps:
      - uses: actions/checkout@v6

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.24.4
        with:
          path: .
          format: cyclonedx-json
          output-file: zalos-sbom.cdx.json

      - name: Compute SHA-256 artifact checksums
        run: sha256sum zalos-sbom.cdx.json > SHA256SUMS.txt

      - name: Upload SBOM & checksums
        uses: actions/upload-artifact@v6
        with:
          name: zalos-ssdf-sbom
          path: |
            zalos-sbom.cdx.json
            SHA256SUMS.txt
          retention-days: 90
