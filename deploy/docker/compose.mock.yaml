name: zalos-mock

# Offline development variant: zalos in --local mode pointed at the
# mock Zalo backend in mock/ (WireMock + crypto gateway). Bring the
# mock stack up first:
#
#   docker compose -f mock/compose.yaml up -d
#   docker compose -f deploy/docker/compose.mock.yaml up -d --build
#
# Then pair and add an account as usual; drive the QR flow and event
# injection with curl against http://127.0.0.1:7355/__mock/... (see
# mock/README.md). No real Zalo servers are contacted.

services:
  zalos:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: zalos:mock
    command: ["zalos", "serve", "--local"]
    ports:
      - "127.0.0.1:${ZALOS_PORT:-7443}:7443"
    environment:
      ZALOS_DATA_DIR: /var/lib/zalos
      ZALOS_CONTAINER: "1"
      ZALOS_ALLOW_LOCAL: "1"
      ZALOS_PORT: "7443"
      ZALOS_PUBLIC_HOST: ${ZALOS_PUBLIC_HOST:-127.0.0.1}
      ZALOS_PUBLIC_PORT: ${ZALOS_PUBLIC_PORT:-7443}
      ZALOS_ZALO_MOCK_URL: http://gateway:7355
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - zalos-data-mock:/var/lib/zalos
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    restart: unless-stopped
    init: true
    networks:
      - mock

networks:
  mock:
    external: true
    name: mock_mock

volumes:
  zalos-data-mock:
