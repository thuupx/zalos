[package]
name = "zalos-vault"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "HPKE vault sealing for zalos encryption at rest"

[dependencies]
hpke = { version = "=0.15.1", default-features = false, features = [
  "alloc",
  "x25519",
  "chacha",
] }
hkdf = "=0.12.4"
sha2 = "=0.10.9"
getrandom = { version = "=0.3.4", default-features = false }
zeroize = "=1.9.2"

