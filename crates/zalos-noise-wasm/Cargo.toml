[package]
name = "zalos-noise-wasm"
version = "1.0.0"
edition.workspace = true
license.workspace = true
description = "wasm-bindgen bindings for zalos-noise"

[lib]
crate-type = ["cdylib"]

[dependencies]
zalos-noise = { path = "../zalos-noise" }
wasm-bindgen = "=0.2.108"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
