[package]
name = "zalos-noise"
version = "1.0.0"
edition.workspace = true
license.workspace = true
description = "Thin wrapper over the snow Noise implementation used by zalos"

[dependencies]
snow = { version = "=0.10.0", default-features = false, features = [
  "default-resolver",
  "default-resolver-crypto",
  "use-getrandom",
] }
zeroize = "=1.9.2"
