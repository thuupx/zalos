[package]
name = "rust_lib_zalos"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
zalos-noise = { path = "../../crates/zalos-noise" }
zalos-vault = { path = "../../crates/zalos-vault" }

[profile.release]
lto = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.3.4", features = ["wasm_js"] }

[workspace]
